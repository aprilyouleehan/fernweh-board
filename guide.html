<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FERNWEH 페른베 이용 안내</title>
<meta name="description" content="경주 한옥 스테이 페른베 이용 안내 · 오시는 길, 와이파이, 이용 규칙">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FERNWEH 페른베">
<meta property="og:title" content="FERNWEH 페른베 이용 안내">
<meta property="og:description" content="오시는 길 · 와이파이 · 이용 안내를 한곳에 모았어요.">
<meta property="og:image" content="https://aprilyouleehan.github.io/fernweh-board/images/hero.jpg">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E6E4DA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E4DA; --card:#F2F0E8; --ink:#2E2E2E; --muted:#5E5A52; --line:#CFCBBE; --fog:#A9ACA9;
  --a:#6B7B84; --b:#5E4B3B; --pine:#2D4530; --on:#F2F0E8;
  --display:"Playfair Display","Noto Serif KR",serif;
  --serif:"Noto Serif KR",serif;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px 20px}
.logo{font-family:var(--display);font-size:19px;letter-spacing:.08em;font-weight:500}
.langs{display:flex;align-items:center;gap:4px}
.langs button{border:0;background:transparent;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--fog);padding:6px 4px;cursor:pointer}
.langs button.on{color:var(--ink)}
.langs .sep{color:var(--line);font-size:12px}

/* hero */
.hero{position:relative;aspect-ratio:1080/590;background:#3a322b center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.hero > .hs{position:absolute;z-index:0;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.6s ease;transform:scale(1.04);transition:opacity 1.6s ease,transform 7s ease-out}
.hero > .hs.on{opacity:1;transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,16,12,.72),rgba(20,16,12,0) 65%)}
.hero > *{position:relative;z-index:1}
.hero .tag{color:#E1DBC9;font-size:13px;margin:0 0 4px}
.hero h1{font-family:var(--display);font-weight:500;color:#fff;font-size:clamp(25px,7.6vw,34px);line-height:1.15;margin:0;white-space:nowrap}
.hero .hello{color:#E1DBC9;font-size:14px;margin:8px 0 0}

/* sections */
.sec{padding:20px 20px 22px;border-bottom:1px solid var(--line)}
.h{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 12px;line-height:1.35}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.p{font-size:14px;letter-spacing:-.2px;color:var(--muted);margin:0 0 8px;line-height:1.75}

/* my stay */
.dates{display:grid;grid-template-columns:repeat(3,1fr);align-items:baseline;padding:10px 0;border-top:1px solid var(--fog)}
.dates .lbl{grid-column:1}
.dates strong{grid-column:2 / 4;font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:-.2px;text-align:left;white-space:nowrap}
.stay{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--fog);border-bottom:1px solid var(--fog)}
.stay div{padding:12px 0}
.lbl{display:block;font-size:12px;color:var(--muted)}
.stay strong{font-family:var(--serif);font-weight:500;font-size:20px;display:inline-flex;align-items:center;height:32px;margin-top:2px}
.stay .room-a,.stay .room-b{color:var(--on);border-radius:8px;padding:0 10px;font-size:17px}
.stay .room-a{background:var(--a)} .stay .room-b{background:var(--b)}
.lockline{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin:12px 0 0}
.lockline svg{flex:none}

/* address */
.addr{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px 14px}
.addr .t{flex:1;line-height:1.4}
.addr .t b{display:block;font-weight:500;font-size:15px}
.addr .t span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500;background:var(--ink);color:var(--on);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.line{background:transparent;border:1px solid var(--fog);color:var(--ink)}
.btn.lg{padding:12px 16px;font-size:14.5px;flex:1}
.grp svg{color:var(--pine)}
.grp{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;margin:6px 0 4px}
.grp:not(:first-child){margin-top:18px}
.cp svg{margin-right:-1px}
.note{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin:10px 2px 0}

/* plan card */
.plan{display:block;width:100%;margin:12px 0 0;padding:0;border:0;background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left}
.plan .img{position:relative;line-height:0;background:#fff}
.plan .img img{width:100%;height:auto;display:block}
.plan .img svg{position:absolute;inset:0;width:100%;height:100%}
.zone{fill:transparent}
.route{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 15;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-17}}
.gate{stroke:#fff;stroke-width:3}
.ring{fill:none;stroke-width:3;animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.9)}}
.plan .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px}
.plan .bar b{font-weight:500}
.plan .bar span{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:2px}
.way{font-size:14.5px;margin:12px 2px 0;line-height:1.7}
.way b{font-weight:700}
.way .ra{color:var(--a)} .way .rb{color:var(--b)}

/* accordions */
details.acc{border-bottom:1px solid var(--line)}
details.acc > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary .ic{color:var(--pine);flex:none}
details.acc > summary .tt{flex:1;font-family:var(--serif);font-weight:500;font-size:17px}
details.acc > summary .chev{color:var(--muted);transition:transform .2s ease;flex:none}
details.acc[open] > summary .chev{transform:rotate(180deg)}
details.acc[open] > summary{background:var(--card)}
.body{padding:4px 20px 20px;background:var(--card)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0;line-height:1.4}
.row .t b{display:block;font-weight:500;font-size:15px}
.row .t span{font-size:12.5px;color:var(--muted)}

ol.steps{list-style:none;counter-reset:s;margin:0 0 6px;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 10px 34px;font-size:14px;letter-spacing:-.2px}
ol.steps li{padding-left:26px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:17px;height:17px;border-radius:50%;background:transparent;border:1px solid var(--fog);color:var(--muted);font-size:10.5px;display:grid;place-items:center}
.mini-h{font-weight:700;font-size:14.5px;margin:16px 0 6px}
.mini-h:first-child{margin-top:6px}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.rule{background:var(--bg);border-radius:10px;padding:12px}
.rule svg{color:var(--pine)}
.rule b{display:block;font-weight:500;font-size:14px;margin:6px 0 2px}
.rule span{display:block;font-size:12.5px;line-height:1.5;color:var(--muted)}

.cap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.cap div{border-radius:10px;padding:12px 14px;color:var(--on)}
.cap b{display:block;font-family:var(--serif);font-weight:500;font-size:17px}
.cap span{font-size:13px}
ul.dots{margin:0;padding:0 0 0 16px;font-size:13.8px;letter-spacing:-.2px;color:var(--muted);line-height:1.7}
ul.dots li{margin:0 0 10px}
.textlink{display:inline-block;margin:2px 0 0;font-size:13.5px;font-weight:500;color:var(--ink)}
.han p{margin:0 0 12px;font-size:14.5px;color:var(--muted);line-height:1.8}

/* contact */
.contact{display:flex;gap:8px;margin-top:4px}
footer{padding:28px 20px 40px;text-align:center}
footer .logo{display:block;font-size:18px}
footer small{color:var(--muted);font-size:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--on);padding:9px 18px;border-radius:999px;font-size:13.5px;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* tour viewer */
.tour{position:fixed;inset:0;z-index:50;background:#141414;color:#E6E4DA;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.tour-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px}
.tour-top button{background:transparent;border:0;color:#E6E4DA;padding:6px;cursor:pointer;line-height:0}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:0 12px}
.slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px;background:#222}
.tour-nav{display:flex;justify-content:center;gap:6px;padding:14px 0 18px}
.tour-nav button{border:1px solid #5E5A52;background:transparent;color:#E6E4DA;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.tour-nav button.on{background:#E6E4DA;color:#141414;border-color:#E6E4DA}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);border:0;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:none;line-height:0}
@media (hover:hover){.arrow{display:grid;place-items:center}}
.arrow.l{left:12px}.arrow.r{right:12px}
.stage{position:relative;flex:1;display:flex;min-height:0}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <span class="logo">FERNWEH</span>
  <div class="langs" id="langs" role="group" aria-label="Language">
    <button type="button" data-l="ko" aria-label="한국어">KO</button>
    <span class="sep" aria-hidden="true">|</span><button type="button" data-l="en" aria-label="English">EN</button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hs on" style="background-image:url('images/hero.jpg')"></div>
  <div class="hs" style="background-image:url('images/hero-2.jpg')"></div>
  <div class="hs" style="background-image:url('images/hero-3.jpg')"></div>
  <h1>Welcome to Fernweh</h1>
  <p class="hello" id="hello" data-t="intro"></p>
</section>

<!-- 내 예약 -->
<section class="sec">
  <h2 class="h" data-t="myStay"></h2>
  <div class="dates" id="datesRow" hidden><span class="lbl" data-t="dates"></span><strong id="datesVal"></strong></div>
  <div class="stay">
    <div><span class="lbl" data-t="room"></span><strong id="roomName">A · B</strong></div>
    <div><span class="lbl" data-t="checkin"></span><strong>15:00</strong></div>
    <div><span class="lbl" data-t="checkout"></span><strong>11:00</strong></div>
  </div>
  <p class="lockline">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span data-t="lock"></span>
  </p>
</section>

<!-- 오시는 길 -->
<section class="sec">
  <h2 class="h" data-t="way"></h2>
  <div class="addr">
    <div class="t"><b>경북 경주시 포석로 980-16</b><span>980-16, Poseok-ro, Gyeongju-si</span></div>
    <button class="btn line cp" type="button" data-copy="경북 경주시 포석로 980-16"></button>
  </div>
  <p class="note">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
    <span data-t="parking"></span>
  </p>

  <button class="plan" type="button" id="openTour">
    <div class="img">
      <img src="images/plan.jpg" alt="Fernweh site plan" width="1020" height="335">
      <svg viewBox="0 0 1020 335" aria-hidden="true" id="planSvg"></svg>
    </div>
    <div class="bar"><b data-t="tour"></b><span><span data-t="pages"></span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span></div>
  </button>

  <p class="way" id="wayText"></p>
</section>

<!-- 와이파이 -->
<details class="acc">
  <summary>
    <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
    <span class="tt">Wi-Fi</span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <div class="body">
    <div class="rows">
      <div class="row"><span class="dot" style="background:var(--fog)"></span><div class="t"><b data-t="lounge"></b><span>fernweh1 · fernweh1!</span></div><button class="btn line cp" type="button" data-copy="fernweh1!"></button></div>
      <div class="row"><span class="dot" style="background:var(--a)"></span><div class="t"><b>Suite A</b><span>fernweh2 · fernweh2!</span></div><button class="btn line cp" type="button" data-copy="fernweh2!"></button></div>
      <div class="row"><span class="dot" style="background:var(--b)"></span><div class="t"><b>Suite B</b><span>fernweh3 · fernweh3!</span></div><button class="btn line cp" type="button" data-copy="fernweh3!"></button></div>
      <div class="row"><span class="dot" style="background:var(--b)"></span><div class="t"><b>Suite B</b><span>fernweh4 · fernweh4!</span></div><button class="btn line cp" type="button" data-copy="fernweh4!"></button></div>
    </div>
  </div>
</details>

<!-- 출입·외출·퇴실 -->
<details class="acc">
  <summary>
    <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M2 21h20M12 12h.01"/></svg>
    <span class="tt" data-t="secEntry"></span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <div class="body">
    <p class="mini-h" data-t="selfH"></p>
    <p class="p" data-t="selfP"></p>
    <p class="mini-h" data-t="lockH"></p>
    <ol class="steps"><li data-t="lock1"></li><li data-t="lock2"></li><li data-t="lock3"></li></ol>
    <p class="mini-h" data-t="outH"></p>
    <p class="p" data-t="outP"></p>
    <p class="mini-h" data-t="bagH"></p>
    <p class="p" data-t="bagP"></p>
  </div>
</details>

<!-- 이용 규칙 -->
<details class="acc">
  <summary>
    <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>
    <span class="tt" data-t="secRules"></span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <div class="body">
    <p class="sub" data-t="rulesSub"></p>
    <div class="rules">
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M8 13H3v3h8M16 13h5v3h-2M17 9c0-2 2-2 2-4M20 9c0-2 2-2 2-4"/></svg><b data-t="r1h"></b><span data-t="r1"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M7 3v6a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6h3v12"/></svg><b data-t="r2h"></b><span data-t="r2"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><circle cx="7" cy="9" r="1.6"/><circle cx="11" cy="5.5" r="1.6"/><circle cx="16" cy="6.5" r="1.6"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5-2 3-4 3-4 0-4-3z"/></svg><b data-t="r3h"></b><span data-t="r3"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M4 10h12v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h2a2 2 0 0 1 0 4h-2"/></svg><b data-t="r4h"></b><span data-t="r4"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 1-3"/></svg><b data-t="r5h"></b><span data-t="r5"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3M4 21l16-3M4 18l16 3"/></svg><b data-t="r6h"></b><span data-t="r6"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7l13-3 2 6-13 3zM9 12l1 4H5M18 8l3 1"/></svg><b>CCTV</b><span data-t="r7"></span></div>
      <div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/></svg><b data-t="r8h"></b><span data-t="r8"></span></div>
    </div>
  </div>
</details>

<!-- 인원·침구 -->
<details class="acc">
  <summary>

t1:"Oreung Back Gate bus stop",t1d:"10 min walk",t2:"Gyeongju Bus Terminal",t2d:"Express & intercity · 5 min by car",t3:"Gyeongju Station (KTX · SRT)",t3d:"About 20 min by car",
secContact:"Need anything?",contactP:"If you need anything during your stay,<br>please feel free to reach out.",call:"Call",text:"Text",thanks:"Thank you. — FERNWEH",
copy:"copy",copied:"Copied",all:"All",hello:"Welcome to Fernweh, {n}.",nights:"{n} night",wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],mo:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]}
};
var COPYICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

var q=new URLSearchParams(location.search), P=window.__P||{};
function g(k){ return (P[k]!=null?P[k]:q.get(k))||''; }
var room=(g('room')+'').trim().toUpperCase(); if(room!=='A'&&room!=='B') room='';
var din=g('in'), dout=g('out'), name=(g('name')+'').trim();
var lang=(g('lang')==='en')?'en':'ko';
try{ var sv=localStorage.getItem('fw-lang'); if(!g('lang')&&sv==='en') lang='en'; }catch(e){}

function pd(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function fmt(d,L,short){ var t=T[L]; return L==='en'? t.mo[d.getMonth()]+' '+d.getDate()+(short?'':'')+' ('+t.wd[d.getDay()]+')' : (short?'':(d.getMonth()+1)+'월 ')+d.getDate()+'일('+t.wd[d.getDay()]+')'; }

function apply(L){
  var t=T[L]; document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(function(el){ var v=t[el.dataset.t]; if(v!=null) el.innerHTML=v; });
  document.querySelectorAll('.cp').forEach(function(b){ b.innerHTML=COPYICON+' '+t.copy; });
  document.getElementById('hello').innerHTML = name ? t.hello.replace('{n}',name) : t.intro;
  var a='<b class="'+(room==='A'?'ra':'')+'">Suite A</b>', b='<b class="'+(room==='B'?'rb':'')+'">Suite B</b>';
  document.getElementById('wayText').innerHTML=t.wayText.replace('{A}',a).replace('{B}',b);
  var di=pd(din), dou=pd(dout), row=document.getElementById('datesRow');
  if(di&&dou){ var n=Math.round((dou-di)/864e5); row.hidden=false;
    var same=(di.getMonth()===dou.getMonth()); document.getElementById('datesVal').textContent=fmt(di,L)+' – '+(L==='en'?fmt(dou,L):fmt(dou,L,same))+' · '+t.nights.replace('{n}',n)+(L==='en'&&n>1?'s':''); }
  var dtxt=document.getElementById('datesVal').textContent.split(' · ')[0]||'';
  document.getElementById('guestReq').href='sms:050714461211?&body='+encodeURIComponent(t.gMsg.replace('{r}',room?('Suite '+room):'').replace('{d}',dtxt));
  var rr=room?('Suite '+room):'';
  document.getElementById('contactSms').href='sms:050714461211?&body='+encodeURIComponent(t.cMsg.replace('{r}',rr).replace('{d}',dtxt));
  var lr=document.getElementById('loungeReq'); lr.href='sms:050714461211?&body='+encodeURIComponent(t.loMsg.replace('{r}',room?('Suite '+room):''));
  document.querySelectorAll('#langs button').forEach(function(x){ x.classList.toggle('on',x.dataset.l===L); });
  lang=L;
}
var rn=document.getElementById('roomName');
if(room){ rn.textContent='Suite '+room; rn.className='room-'+room.toLowerCase(); }
apply(lang);

// language buttons
document.querySelectorAll('#langs button').forEach(function(b){
  b.addEventListener('click',function(){
    var L=b.dataset.l;
    try{ localStorage.setItem('fw-lang',L); }catch(e){}
    apply(L);
  });
});

// hero slideshow
(function(){ var hs=document.querySelectorAll('#hero .hs'), i=0;
  if(hs.length<2||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(function(){ if(document.hidden) return; hs[i].classList.remove('on'); i=(i+1)%hs.length; hs[i].classList.add('on'); },5000);
})();

// plan overlay
var C={A:'#6B7B84',B:'#5E4B3B'};
var R={A:{zone:[318,72,228,192],pts:'905,170 908,244 600,270 455,272 455,258',gate:[455,254]},
       B:{zone:[18,66,296,258],pts:'905,170 908,244 600,270 455,276 318,285',gate:[312,285]}};
var svg=document.getElementById('planSvg'), h='';
['A','B'].forEach(function(k){ var r=R[k], on=(room===k);
  if(on){ h+='<rect x="'+r.zone[0]+'" y="'+r.zone[1]+'" width="'+r.zone[2]+'" height="'+r.zone[3]+'" rx="10" fill="'+C[k]+'" fill-opacity=".28"/>';
    h+='<polyline class="route" points="'+r.pts+'" stroke="'+C[k]+'"/>';
    h+='<circle class="ring" cx="'+r.gate[0]+'" cy="'+r.gate[1]+'" r="15" stroke="'+C[k]+'"/>'; }
  h+='<circle class="gate" cx="'+r.gate[0]+'" cy="'+r.gate[1]+'" r="'+(on?10:8)+'" fill="'+C[k]+'"/>'; });
h+='<rect x="907" y="88" width="46" height="34" rx="8" fill="#2E2E2E"/><text x="930" y="113" text-anchor="middle" fill="#F2F0E8" font-family="Playfair Display,serif" font-size="24" font-weight="600">P</text>';
svg.innerHTML=h;

// tour
var tour=document.getElementById('tour'), track=document.getElementById('track'), cnt=document.getElementById('count');
var N=15, built=false, navBtns=tour.querySelectorAll('[data-go]');
function build(){ if(built) return; built=true; var s='';
  for(var i=1;i<=N;i++){ var n=(i<10?'0':'')+i;
    s+='<div class="slide"><img src="images/tour-'+n+'.jpg" alt="Fernweh space guide '+i+'" loading="'+(i<4?'eager':'lazy')+'" width="900" height="1125"></div>'; }
  track.innerHTML=s; }
function idx(){ return Math.round(track.scrollLeft/Math.max(1,track.clientWidth)); }
function go(i,sm){ track.scrollTo({left:i*track.clientWidth,behavior:sm?'smooth':'auto'}); }
function upd(){ var i=idx(); cnt.textContent=(i+1)+' / '+N; var sec=i>=7?2:(i>=2?1:0); navBtns.forEach(function(b,j){ b.classList.toggle('on',j===sec); }); }
track.addEventListener('scroll',function(){ requestAnimationFrame(upd); },{passive:true});
document.getElementById('openTour').addEventListener('click',function(){ build(); tour.hidden=false; document.body.style.overflow='hidden'; requestAnimationFrame(function(){ go(0,false); upd(); }); });
function close(){ tour.hidden=true; document.body.style.overflow=''; }
document.getElementById('closeTour').addEventListener('click',close);
document.getElementById('prev').addEventListener('click',function(){ go(Math.max(0,idx()-1),true); });
document.getElementById('next').addEventListener('click',function(){ go(Math.min(N-1,idx()+1),true); });
navBtns.forEach(function(b){ b.addEventListener('click',function(){ go(+b.dataset.go,true); }); });
document.addEventListener('keydown',function(e){ if(tour.hidden) return; if(e.key==='Escape') close();
  if(e.key==='ArrowRight') go(Math.min(N-1,idx()+1),true); if(e.key==='ArrowLeft') go(Math.max(0,idx()-1),true); });

// copy
var toast=document.getElementById('toast'), tm;
function show(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(tm); tm=setTimeout(function(){ toast.classList.remove('show'); },1600); }
function fb(x){ var a=document.createElement('textarea'); a.value=x; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(a); }
document.querySelectorAll('[data-copy]').forEach(function(el){ el.addEventListener('click',function(){ var x=el.dataset.copy, m=T[lang].copied;
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(x).then(function(){show(m);},function(){fb(x);show(m);}); } else { fb(x); show(m); } }); });
})();
</script>
